name: personal_ai_agent_client
description: "Companion Flutter client for the personal AI voice assistant."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter
  livekit_components: ^1.3.1
  cupertino_icons: ^1.0.8
  chat_bubbles: ^1.6.0
  livekit_client: ^2.10.0
  flutter_dotenv: ^6.0.0
  http: ^1.3.0
  provider: ^6.1.2
  url_launcher: ^6.3.1
  shimmer: ^3.0.0
  uuid: ^4.5.1
  flutter_sficon: ^1.2.0
  intl: ^0.20.0
  logging: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
