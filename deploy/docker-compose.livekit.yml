# Jarvis personal agent - self-hosted LiveKit server.
#
# Pinned to livekit-server v1.13.7 (latest stable, released 2026-09-14).
# Bump the tag deliberately after reading https://github.com/livekit/livekit/releases -
# never use :latest here (a silent SFU upgrade changes WebRTC behavior).
#
# Run from anywhere (paths are absolute):
#   docker compose -f /path/to/repo/deploy/docker-compose.livekit.yml up -d
#
# The deploy.sh script brings this up automatically. API keys live in
# /opt/jarvis/livekit/keys.yaml (600, generated by generate-keys.sh) - never in the repo.

services:
  livekit:
    image: livekit/livekit-server:v1.13.7
    container_name: jarvis-livekit
    restart: unless-stopped
    command:
      - --config
      - /etc/livekit/livekit.yaml
      - --key-file
      - /etc/livekit/keys.yaml
    ports:
      - "7880:7880"      # websocket / signaling + HTTP API (Caddy reverse-proxies this)
      - "7881:7881"      # RTC media over TCP
      - "7882:7882/udp"  # RTC media over UDP (muxed)
      - "3478:3478/udp"  # built-in TURN fallback (optional; open in ufw if used)
    volumes:
      - /opt/jarvis/livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro
      - /opt/jarvis/livekit/keys.yaml:/etc/livekit/keys.yaml:ro
    # Lets the LiveKit container reach the AgentServer HTTP endpoint
    # (jarvis-agent.service) on the host for agent_dispatch.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # LiveKit answers 404 on / when healthy; anything but connection-refused counts.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7880/ || [ $? -eq 8 ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
