# caddy-snippets.conf - Jarvis reverse-proxy blocks for the existing Caddy.
#
# HOW TO INSTALL (on the VPS, once):
#   1. Copy this file to the VPS, e.g. /opt/jarvis/caddy/caddy-snippets.conf
#      (deploy.sh does this automatically).
#   2. Add ONE line to the existing Caddyfile (global scope, outside any site block):
#          import /opt/jarvis/caddy/caddy-snippets.conf
#   3. Validate and reload:
#          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
#          systemctl reload caddy
#
# TLS relies on the VPS's existing on-demand TLS setup for *.86-48-18-41.sslip.io
# (already fronting 86-48-18-41.sslip.io and n8n.86-48-18-41.sslip.io). The `tls { on_demand }`
# blocks below hook into that; do not add a second on_demand_tls global block.

jarvis.86-48-18-41.sslip.io {
	tls {
		on_demand
	}
	# Flask web layer: health, status, config, integration hooks.
	reverse_proxy localhost:5000
}

livekit.86-48-18-41.sslip.io {
	tls {
		on_demand
	}
	# LiveKit signaling (websocket). reverse_proxy handles the Upgrade automatically.
	# Media does NOT go through Caddy: clients reach the server directly on
	# 7881/tcp and 7882/udp (see ufw notes in DEPLOY.md).
	reverse_proxy localhost:7880
}
